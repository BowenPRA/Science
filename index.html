    <script type="text/javascript">
  // This script checks if we were just redirected from the 404 page
  (function(l) {
    if (l.search[1] === '/' ) {
      var decoded = l.search.slice(1).split('&').map(function(s) { 
        return s.replace(/~and~/g, '&') 
      }).filter(function(v) { return v[0] === 'p' })[0];
      if (decoded !== undefined) {
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded.slice(1) +
          (l.search[1] === '/' ? l.search.slice(decoded.length + 2).replace(/&/g, '~and~') : l.search) +
          l.hash
        );
      }
    }
  }(window.location))
</script>
